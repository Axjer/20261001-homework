<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的幸運物：Casio F91W</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="title">我的考試幸運物：Casio F91W</h1>
      <p class="subtitle">
        這隻經典的電子錶，象徵著簡單與可靠。因為在我考試時只要戴著這隻錶，就會考得比較好，是我的必勝幸運物！
      </p>

      <div class="watch" id="watch">
        <div class="screen" id="screen">
          <div class="day-date">
            <span id="day">TU</span> <span id="date">24</span>
          </div>
          <div class="time">
            <span id="hours">10</span>:<span id="minutes">08</span
            ><span class="seconds" id="seconds">59</span>
          </div>
          <div class="mode-indicator" id="mode-indicator">
            <span id="am-pm">PM</span>
          </div>
        </div>
        <div class="buttons">
          <button class="btn btn-light" id="btn-light">LIGHT</button>
          <button class="btn btn-mode" id="btn-mode">MODE</button>
          <button class="btn btn-alarm" id="btn-alarm">ALARM / 24HR</button>
        </div>
      </div>

      <div class="controls">
        <h3>✨ 互動體驗說明 ✨</h3>
        <ul>
          <li>
            <strong>滑鼠懸停 (Hover)</strong
            >：將滑鼠移到手錶上，會感受到幸運物的「金光能量」，手錶會放大並發光。
          </li>
          <li>
            <strong>按鈕點擊 (Click)</strong
            >：按鈕擁有真實的下壓動畫與顏色反饋。
          </li>
          <li>
            <strong>LIGHT</strong>: 按住點亮經典綠色背光（碼表暫停時可歸零）。
          </li>
          <li><strong>MODE</strong>: 切換 時鐘模式 / 計時碼表模式。</li>
          <li>
            <strong>ALARM / 24HR</strong>: 時鐘模式切換 12/24
            小時制；碼表模式控制開始與暫停。
          </li>
        </ul>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
